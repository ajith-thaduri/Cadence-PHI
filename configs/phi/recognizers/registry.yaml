# REGISTRY RECOGNIZERS - owner: privacy (matching policy) + engineering.
# A request carries only an opaque RegistryContext; RegistryStore resolves it to ONE subject's record plus
# versioned directories. kind_entities: which entity each registry kind emits. matching: exact /
# normalized / conservative fuzzy policy (edit distance limits, nicknames, particles, common words that
# only match when capitalised).
recognizers:
  registry_member:
    enabled: true
    kinds:
    - member
    version: '1'
  registry_provider:
    enabled: true
    kinds:
    - provider
    version: '1'
  registry_staff:
    enabled: true
    kinds:
    - staff
    version: '1'
  registry_facility:
    enabled: true
    kinds:
    - facility
    version: '1'
  registry_employer:
    enabled: true
    kinds:
    - employer
    version: '1'
  registry_contact:
    enabled: true
    kinds:
    - contact
    version: '1'
  registry_identifier:
    enabled: true
    kinds:
    - identifier
    - record
    version: '1'
registry:
  fuzzy: true
  single_token_requires_capital: true
  directories_path: data/registry
  kind_entities:
    member:
    - NAME
    provider:
    - PROVIDER_NAME
    staff:
    - CARE_TEAM_MEMBER
    facility:
    - FACILITY_NAME
    employer:
    - EMPLOYER
    contact:
    - RELATIVE_NAME
    identifier:
    - MEMBER_ID
    - MRN
    - PHONE
    - NPI
    record:
    - EMAIL
    - ADDRESS
    - CITY
    - ZIP
    - DOB
  matching:
    fuzzy: true
    fuzzy_min_len: 5
    fuzzy_max_edits: 1
    fuzzy_max_edits_long: 2
    fuzzy_long_len: 8
    single_token_requires_capital: true
    partial_token_min_len: 3
    nicknames:
      robert:
      - bob
      - rob
      - bobby
      william:
      - bill
      - will
      - billy
      patricia:
      - pat
      - patty
